<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountriesIRL export fixture</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #ffffff;
      }

      #root {
        width: 540px;
        height: 540px;
      }

      .map-export-source,
      .map-canvas {
        display: block;
        width: 540px;
        height: 540px;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement, useCallback, useEffect, useRef, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { MapCanvas } from '/src/components/MapCanvas.tsx';
      import { LegendOverlay } from '/src/components/LegendOverlay.tsx';
      import { CompositionStateProvider } from '/src/providers/CompositionStateProvider.tsx';
      import { useCompositionState } from '/src/hooks/useCompositionState.ts';
      import { useGeoData } from '/src/hooks/useGeoData.ts';
      import { exportMapPng } from '/src/utils/export.ts';

      const h = createElement;
      const LEGEND_COLOR = '#DC2626';
      const LEGEND_LABEL = 'Pacific route';
      const EXPORT_DATE = new Date('2026-07-21T12:00:00.000Z');
      // Fiji straddles the date line: only wrapped repeats make it whole.
      const DATE_LINE_COUNTRY = 'FJI';

      // The export frame is a body-level div holding the sanitized clone.
      // Snapshot it as it lands so the spec can inspect exactly what the
      // rasteriser was handed, without stubbing anything.
      let lastClone = null;

      function summarizeAttributeUse(svg) {
        const elements = [svg, ...svg.querySelectorAll('*')];
        let ariaAttributes = 0;
        let ids = 0;
        const survivingIds = new Set();
        const references = [];
        elements.forEach((element) => {
          element.getAttributeNames().forEach((name) => {
            if (name.startsWith('aria-')) {
              ariaAttributes += 1;
            }
            if (name === 'id') {
              ids += 1;
              survivingIds.add(element.getAttribute('id'));
            }
            // 04-10. `id` stripping is REFERENCE-AWARE, so a bare count cannot
            // say whether the sanitizer got it right: `ids === 0` is what a
            // stripped gradient looks like, and `coding-rules/export.md` names
            // that assertion as one that CONFIRMS the break. Collect both sides
            // instead - what survived, and what points at something.
            const value = element.getAttribute(name) ?? '';
            [...value.matchAll(/url\(\s*['"]?#([^'")\s]+)/gu)].forEach((match) => {
              references.push(match[1]);
            });
            if ((name === 'href' || name === 'xlink:href') && value.startsWith('#')) {
              references.push(value.slice(1));
            }
          });
        });
        return {
          ariaAttributes,
          ids,
          referencedIds: [...new Set(references)].sort(),
          danglingReferences: [...new Set(references)]
            .filter((id) => !survivingIds.has(id))
            .sort(),
          unreferencedIds: [...survivingIds]
            .filter((id) => !references.includes(id))
            .sort(),
        };
      }

      function summarizeClone(frame) {
        const svgs = frame.querySelectorAll('svg');
        const svg = svgs[0] ?? null;
        if (svg === null) {
          return { svgCount: svgs.length };
        }
        const scenePaths = [...svg.querySelectorAll('path.scene-path')];
        const legend = svg.querySelector('[data-layer="legend"]');
        const camera = svg.querySelector('[data-layer="camera"]');
        const {
          ariaAttributes,
          ids,
          referencedIds,
          danglingReferences,
          unreferencedIds,
        } = summarizeAttributeUse(svg);
        // Assertion 25 Part 1: the injected export @font-face, observed on the
        // real clone as it lands in the body — never by stubbing.
        const fontStyle = svg.querySelector('style');
        // 04-04: one family now emits TWO faces split by unicode-range. Split
        // the injected text per rule so the spec can assert the count, the
        // family of each face, and that the two ranges actually DIFFER — a
        // second face repeating the first's range is a silent no-op.
        const fontFaces = (fontStyle?.textContent ?? '')
          .split('@font-face')
          .slice(1)
          .map((block) => ({
            family: (block.match(/font-family:\s*'([^']+)'/) ?? [])[1] ?? null,
            unicodeRange:
              ((block.match(/unicode-range:\s*([^;}]+)/) ?? [])[1] ?? '').trim() ||
              null,
            hasWoff2DataUrl: /src:\s*url\(data:font\/woff2;base64,/.test(block),
          }));

        return {
          fontFaces,
          svgCount: svgs.length,
          frameBackgroundColor: frame.style.backgroundColor,
          fontStyle:
            fontStyle === null
              ? null
              : {
                  isFirstChild: svg.firstElementChild === fontStyle,
                  hasFontFace: /@font-face/.test(fontStyle.textContent ?? ''),
                  hasWoff2DataUrl: /src:\s*url\(data:font\/woff2;base64,/.test(
                    fontStyle.textContent ?? '',
                  ),
                },
          layerOrder: [...svg.children].map((child) =>
            child.getAttribute('data-layer'),
          ),
          cameraTransform: camera?.getAttribute('transform') ?? null,
          legendTransform: legend?.getAttribute('transform') ?? null,
          legendTexts: [...(legend?.querySelectorAll('text') ?? [])].map(
            (node) => node.textContent,
          ),
          legendEditorOnly: legend?.querySelectorAll('[data-editor-only]').length ?? -1,
          scenePathCount: scenePaths.length,
          pathKindCounts: scenePaths.reduce((counts, path) => {
            const kind = path.getAttribute('data-path-kind') ?? 'none';
            counts[kind] = (counts[kind] ?? 0) + 1;
            return counts;
          }, {}),
          emptyGeometryCount: scenePaths.filter(
            (path) => (path.getAttribute('d') ?? '') === '',
          ).length,
          strokes: [
            ...new Set(scenePaths.map((path) => path.getAttribute('stroke'))),
          ].sort(),
          strokeWidths: [
            ...new Set(scenePaths.map((path) => path.getAttribute('stroke-width'))),
          ].sort(),
          vectorEffects: scenePaths.filter(
            (path) => path.getAttribute('vector-effect') !== null,
          ).length,
          roles: svg.querySelectorAll('[role]').length,
          tabStops: svg.querySelectorAll('[tabindex]').length,
          focusables: svg.querySelectorAll('[focusable]').length,
          titles: svg.querySelectorAll('title').length,
          ariaAttributes,
          ids,
          referencedIds,
          danglingReferences,
          unreferencedIds,
          editorOnly: svg.querySelectorAll('[data-editor-only]').length,
          outgoingScenes: svg.querySelectorAll(
            '[data-layer="outgoing-scenes"],[data-layer="outgoing-scene"]',
          ).length,
          selectionClasses: svg.querySelectorAll('.selected,.hovered,.focused').length,
        };
      }

      new MutationObserver((records) => {
        records.forEach((record) => {
          record.addedNodes.forEach((node) => {
            if (
              node instanceof HTMLDivElement &&
              node.getAttribute('aria-hidden') === 'true' &&
              node.querySelector('svg') !== null
            ) {
              lastClone = summarizeClone(node);
            }
          });
        });
      }).observe(document.body, { childList: true });

      function ExportFixture() {
        const { state, setLegendEntry, setLegendStyle } = useCompositionState();
        const mapRef = useRef(null);
        const [selectedIds, setSelectedIds] = useState(new Set());
        const colors = { FRA: LEGEND_COLOR };
        const effectiveColors = [LEGEND_COLOR];
        const geoData = useGeoData();

        useEffect(() => {
          setLegendEntry({ color: LEGEND_COLOR, label: LEGEND_LABEL, order: 0 });
        }, [setLegendEntry]);

        const selectCountry = useCallback((countryId) => {
          setSelectedIds(new Set([countryId]));
        }, []);
        const clearSelection = useCallback(() => setSelectedIds(new Set()), []);

        window.__exportFixture = {
          get lastClone() {
            return lastClone;
          },
          get bodyFrameCount() {
            return document.querySelectorAll('body > div[aria-hidden="true"]').length;
          },
          get anchorCount() {
            return document.querySelectorAll('body > a[download]').length;
          },
          // The live legend state, so the spec can derive crop bounds through
          // the real resolveLegendRender instead of hard-coding a rectangle.
          get legendState() {
            return state.legend;
          },
          setLegendLabel: (label) =>
            setLegendEntry({ color: LEGEND_COLOR, label, order: 0 }),
          setLegendTextSize: (textSize) =>
            setLegendStyle({
              theme: state.legend.theme,
              textSize,
              backgroundOpacity: state.legend.backgroundOpacity,
              borderStyle: state.legend.borderStyle,
            }),
          selectCountry,
          showDateLine: () =>
            mapRef.current?.restore({
              zoom: 3,
              centerLongitude: 179,
              centerLatitude: 0,
            }) ?? false,
          // Deep south-east Pacific at high zoom: nothing but ocean is in
          // frame, so in the exported PNG every non-white pixel is legend ink
          // and containment is assertable absolutely.
          showOcean: () =>
            mapRef.current?.restore({
              zoom: 12,
              centerLongitude: -130,
              centerLatitude: -45,
            }) ?? false,
          // Mirrors App's export transaction shape without owning it: freeze,
          // finalize, export, then release in the outermost finally.
          run: async (mapName) => {
            const handle = mapRef.current;
            if (handle === null) {
              return { ok: false, reason: 'no-handle' };
            }
            let lease = null;
            try {
              lease = handle.freezeAndSnapshot();
              handle.finalizeSelectedScene();
              const source = handle.getExportSource();
              if (source === null) {
                return { ok: false, reason: 'no-source' };
              }
              return await exportMapPng(source, EXPORT_DATE, mapName);
            } finally {
              lease?.release();
            }
          },
          // Defect shape guarded by `invalid-composition`: a legend that lives
          // beside the canonical SVG is silently dropped by cloneNode.
          moveLegendOutsideCanvas: () => {
            const source = mapRef.current?.getExportSource() ?? null;
            const legend = source?.querySelector('[data-layer="legend"]') ?? null;
            if (source === null || legend === null) {
              return false;
            }
            source.append(legend);
            return true;
          },
          failBlobEncoding: () => {
            HTMLCanvasElement.prototype.toBlob = function nullToBlob(callback) {
              callback(null);
            };
          },
          failObjectUrl: () => {
            URL.createObjectURL = () => {
              throw new Error('object url blocked');
            };
          },
          failAnchorClick: () => {
            HTMLAnchorElement.prototype.click = function blockedClick() {
              throw new Error('download blocked');
            };
          },
          failCanvasContext: () => {
            // A blocked 2D context is how rasterisation fails in the wild.
            HTMLCanvasElement.prototype.getContext = () => null;
          },
        };

        if (geoData.status !== 'ready') {
          return h('p', { role: 'status' }, geoData.status);
        }

        return h(MapCanvas, {
          snapshotId: 'modern',
          periodLabel: 'Modern — current borders',
          ref: mapRef,
          features: geoData.features,
          colors,
          /*
           * 04-08: DECLARED, not defaulted. The app's default coastline weight
           * is `none`, and an unstroked fixture would turn the clone gate's
           * "the selected country's wrapped repeats are normalized to the same
           * border as its primary copy" assertion into a comparison of two
           * absent strokes - true, and about nothing. `thin` is exactly the
           * pre-04-08 weight, so that assertion keeps its original subject.
           */
          coastlineWeight: 'thin',
          selectedIds,
          onSelectCountry: selectCountry,
          onClearSelection: clearSelection,
          onTooltipChange: () => undefined,
          legendSlot: h(LegendOverlay, {
            legend: state.legend,
            effectiveColors,
            onPositionChange: () => undefined,
            onStatusMessage: () => undefined,
          }),
        });
      }

      window.__DATE_LINE_COUNTRY = DATE_LINE_COUNTRY;

      createRoot(document.getElementById('root')).render(
        h(CompositionStateProvider, null, h(ExportFixture)),
      );
    </script>
  </body>
</html>
