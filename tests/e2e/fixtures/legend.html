<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CountriesIRL Legend Fixture</title>
    <style>
      body {
        margin: 16px;
        color: #111827;
        font-family: Inter, system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) 540px;
        gap: 24px;
        align-items: start;
      }
      button,
      input {
        min-height: 44px;
      }
      .legend-editor__entry,
      fieldset,
      .fixture-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-block: 8px;
      }
      .legend-editor__entry:focus {
        outline: 3px solid #0f766e;
      }
      .legend-editor__swatch {
        width: 32px;
        height: 32px;
        border: 1px solid #111827;
      }
      /*
       * Scoped to the legend canvas: `03-07` gave the editor's reorder
       * buttons inline SVG glyphs, and a bare `svg` rule inflated each glyph
       * to a second 540px square.
       */
      svg[data-legend-canvas='true'] {
        width: 540px;
        height: 540px;
        border: 1px solid #9ca3af;
        background: #ffffff;
        touch-action: none;
      }
      [role='alert'] {
        color: #b42318;
      }
      output {
        display: block;
        margin-block: 8px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useEffect, useMemo, useState } from 'react';
      import { createRoot } from 'react-dom/client';
      import { LegendDisclosure } from '/src/components/LegendDisclosure.tsx';
      import { LegendEditor } from '/src/components/LegendEditor.tsx';
      import {
        LegendOverlay,
        getLegendOverlayBounds,
      } from '/src/components/LegendOverlay.tsx';
      import { CompositionStateProvider } from '/src/providers/CompositionStateProvider.tsx';
      import { useCompositionState } from '/src/hooks/useCompositionState.ts';
      import {
        getActiveLegendEntries,
        inferLegendForm,
        validateActiveLegend,
      } from '/src/utils/legend.ts';
      import { DEFAULT_UNCOLORED_FILL } from '/src/constants/mapStyle.ts';

      const h = React.createElement;
      /*
       * D4-13: this harness renders NO bands, so its extents are genuinely
       * zero and every position assertion in `legend.spec.ts` is the bare safe
       * inset. Stated explicitly rather than defaulted — a defaulted zero is
       * indistinguishable from a call site that forgot.
       */
      const NO_BANDS = { top: 0, bottom: 0 };
      const STANDARD_COLORS = ['#DC2626', '#2563EB', '#B45309'];
      const HISTORICAL_COLOR = '#B45309';
      const POSITION_LABELS = {
        'top-left': 'Top left',
        'top-right': 'Top right',
        'bottom-left': 'Bottom left',
        'bottom-right': 'Bottom right',
      };

      const COLOR_COUNT_OPTIONS = [8, 9, 16, 17, 31];

      function createColorSet(count) {
        return Array.from(
          { length: count },
          (_, index) => `#${(index + 1).toString(16).padStart(6, '0').toUpperCase()}`,
        );
      }

      function LegendFixture() {
        const {
          state,
          setLegendEntry,
          setLegendStyle,
          setLegendOrder,
          setLegendPosition,
        } = useCompositionState();
        const [colorCount, setColorCount] = useState(null);
        const [isLegendExpanded, setIsLegendExpanded] = useState(false);
        const [statusMessage, setStatusMessage] = useState('');
        const [cameraEvents, setCameraEvents] = useState(0);
        const [exportEditorOnlyCount, setExportEditorOnlyCount] = useState(null);
        const [exportLegendFrame, setExportLegendFrame] = useState(null);
        const effectiveColors = useMemo(
          () => (colorCount === null ? STANDARD_COLORS : createColorSet(colorCount)),
          [colorCount],
        );
        const commands = useMemo(
          () => ({
            setLegendEntry,
            setLegendStyle,
            setLegendOrder,
            setLegendPosition,
          }),
          [
            setLegendEntry,
            setLegendStyle,
            setLegendOrder,
            setLegendPosition,
          ],
        );
        useEffect(() => {
          const knownColors = new Set(
            state.legend.entries.map((entry) => entry.color),
          );
          let nextOrder = state.legend.entries.reduce(
            (maximum, entry) => Math.max(maximum, entry.order),
            -1,
          );
          effectiveColors.forEach((color) => {
            if (!knownColors.has(color)) {
              nextOrder += 1;
              setLegendEntry({ color, label: color, order: nextOrder });
              knownColors.add(color);
            }
          });
        }, [effectiveColors, setLegendEntry, state.legend.entries]);

        /*
         * D4-12: a REAL `ColorMap` built from the fixture's colours, so the
         * form is INFERRED here exactly as `App` infers it rather than
         * hard-coded. Every colour is a custom hex, so the inferred form is
         * `rows` — and the `Form` pills can still override it to `bar`, which
         * is what lets `legend.spec.ts` drive both forms from one harness.
         */
        const colorMap = useMemo(
          () =>
            Object.fromEntries(
              effectiveColors.map((hex, index) => [
                `C${index}`,
                { kind: 'custom', hex },
              ]),
            ),
          [effectiveColors],
        );
        const inferredForm = inferLegendForm(colorMap);
        const bounds = getLegendOverlayBounds(
          state.legend,
          effectiveColors,
          inferredForm,
        );
        const activeEntries = getActiveLegendEntries(effectiveColors, state.legend);
        // Mirrors App: the export gate is derived from live legend state, not
        // reported up from the editor (which unmounts when the panel closes).
        const validation = validateActiveLegend(
          state.legend,
          effectiveColors,
          bounds,
          NO_BANDS,
        );
        const positionLabel =
          state.legend.position.preset === null
            ? 'Custom'
            : POSITION_LABELS[state.legend.position.preset];

        // No position write-back effect on purpose: `resolveLegendPosition`
        // derives the rendered position from the live bounds, so a stored
        // position can never leave the export frame.

        const handleExport = () => {
          const source = document.querySelector('svg[data-legend-canvas="true"]');
          const clone = source.cloneNode(true);
          clone.querySelectorAll('[data-editor-only]').forEach((node) => node.remove());
          setExportEditorOnlyCount(
            clone.querySelectorAll('[data-editor-only]').length,
          );
          /*
           * D4-11 removed the legend's background rect, which this used to
           * read for the exported frame. The replacement MEASURES the clone
           * instead of restating a derivation: the union of every surviving
           * swatch box IS the ink the exporter captured, so a clipped clone
           * reports a smaller extent rather than the same tidy rectangle.
           */
          const clonedLegend = clone.querySelector('g[data-layer="legend"]');
          const swatches = clonedLegend === null
            ? []
            : [...clonedLegend.querySelectorAll('rect')];
          if (clonedLegend === null || swatches.length === 0) {
            setExportLegendFrame('no-legend');
          } else {
            const [, x, y] = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(
              clonedLegend.getAttribute('transform'),
            );
            const read = (node, name) => Number(node.getAttribute(name));
            const left = Math.min(...swatches.map((node) => read(node, 'x')));
            const top = Math.min(...swatches.map((node) => read(node, 'y')));
            const right = Math.max(
              ...swatches.map((node) => read(node, 'x') + read(node, 'width')),
            );
            const bottom = Math.max(
              ...swatches.map((node) => read(node, 'y') + read(node, 'height')),
            );
            setExportLegendFrame(
              [
                Number(x) + left,
                Number(y) + top,
                right - left,
                bottom - top,
                swatches.length,
              ].join(','),
            );
          }
          setStatusMessage('PNG downloaded at 1080 × 1080.');
        };

        return h(
          'main',
          null,
          h(
            'section',
            null,
            h(
              'div',
              { className: 'fixture-controls' },
              ...COLOR_COUNT_OPTIONS.map((count) =>
                h(
                  'button',
                  {
                    key: `colors-${count}`,
                    type: 'button',
                    onClick: () => setColorCount(count),
                  },
                  `Use ${count} colors`,
                ),
              ),
              h(
                'button',
                { type: 'button', onClick: () => setColorCount(null) },
                'Use standard colors',
              ),
              h(
                'button',
                {
                  type: 'button',
                  disabled: !validation.ok,
                  onClick: handleExport,
                },
                'Export PNG',
              ),
            ),
            h(
              LegendDisclosure,
              {
                entryCount: activeEntries.length,
                positionLabel,
                isExpanded: isLegendExpanded,
                onExpandedChange: setIsLegendExpanded,
                onStatusMessage: setStatusMessage,
              },
              h(LegendEditor, {
                legend: state.legend,
                effectiveColors,
                bounds,
                bandExtents: NO_BANDS,
                inferredForm,
                commands,
                onStatusMessage: setStatusMessage,
              }),
            ),
            h('output', { 'data-status': 'true', 'aria-live': 'polite' }, statusMessage),
            h(
              'output',
              { 'data-position': 'true' },
              `${state.legend.position.x},${state.legend.position.y},${positionLabel}`,
            ),
            h(
              'output',
              { 'data-style': 'true' },
              state.legend.textSize,
            ),
            h(
              'output',
              { 'data-form': 'true' },
              `${state.legend.form ?? 'inferred'},${inferredForm}`,
            ),
            h('output', { 'data-camera-events': 'true' }, String(cameraEvents)),
            h(
              'output',
              { 'data-export-editor-only': 'true' },
              exportEditorOnlyCount === null ? 'not-exported' : String(exportEditorOnlyCount),
            ),
            h(
              'output',
              { 'data-export-legend-frame': 'true' },
              exportLegendFrame === null ? 'not-exported' : exportLegendFrame,
            ),
            h('output', { 'data-historical-color': 'true' }, HISTORICAL_COLOR),
          ),
          h(
            'svg',
            {
              viewBox: '0 0 1080 1080',
              role: 'img',
              'aria-label': 'Legend interaction canvas',
              'data-legend-canvas': 'true',
              onPointerDown: () => setCameraEvents((count) => count + 1),
              onPointerMove: () => setCameraEvents((count) => count + 1),
              onPointerUp: () => setCameraEvents((count) => count + 1),
              onWheel: () => setCameraEvents((count) => count + 1),
            },
            h('rect', { x: 0, y: 0, width: 1080, height: 1080, fill: '#FFFFFF' }),
            h(
              'g',
              { 'data-layer': 'camera', transform: 'translate(0 0)' },
              h('rect', {
                x: 160,
                y: 220,
                width: 360,
                height: 240,
                fill: '#E2E8F0',
              }),
            ),
            h(LegendOverlay, {
              legend: state.legend,
              effectiveColors,
              bandExtents: NO_BANDS,
              inferredForm,
              uncoloredFill: DEFAULT_UNCOLORED_FILL,
              onPositionChange: setLegendPosition,
              onStatusMessage: setStatusMessage,
            }),
          ),
        );
      }

      createRoot(document.getElementById('root')).render(
        h(CompositionStateProvider, null, h(LegendFixture)),
      );
    </script>
  </body>
</html>
